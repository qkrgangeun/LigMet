# lightning.pytorch==2.0.9.post0
seed_everything: 42
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 32-true
  logger: null
  callbacks: null
  fast_dev_run: false
  max_epochs: null
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
model:
  model: ligmet.models.Model
  model_config:
    dl_threshold: 0.5
    encoder_args:
      input_dim: 230
      hidden_dim: 64
      dropout_rate: 0.1
      output_dim: 32
      egnn_args:
        input_dim: 32
        hidden_dim: 64
        num_layers: 5
        edge_feat_dim: 0
        output_dim: 32
        dropout_rate: 0.1
    decoder_args:
      use_attention_prob: false
      use_attention_type: false
      binning_layer_args:
        input_dim: 32
        output_dim: 3
        num_layers: 3
        dropout_rate: 0.5
      prob_transform_args:
        attention:
          input_dim: 32
          embed_dim: 16
          output_dim: 1
          num_heads: 4
          dropout_rate: 0.1
          num_layers: 5
        linear:
          input_dim: 32
          output_dim: 1
          num_layers: 5
          dropout_rate: 0.1
      type_transform_args:
        attention:
          input_dim: 32
          embed_dim: 8
          output_dim: 11
          num_heads: 4
          dropout_rate: 0.1
          num_layers: 5
        linear:
          input_dim: 32
          output_dim: 11
          num_layers: 5
          dropout_rate: 0.1
data:
  test_data_file: dataset/run_test.txt
  dl_test_result_dir: test_output_dir
  onthefly:
    pdb_dir: /home/qkrgangeun/LigMet/data/biolip_backup/pdb
    rf_model_path: param/randomforest_param
    topk: 16
    edge_dist_cutoff: 15
    pocket_dist: 3
    rf_threshold: 0.5
  test_loader_params:
    batch_size: 1
    num_workers: 0
    shuffle: false
    pin_memory: false
optimizer: null
lr_scheduler: null
ckpt_path: param/dl.ckpt
verbose: true
