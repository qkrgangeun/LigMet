  dl_test_result_dir: "/home/qkrgangeun/LigMet/data/biolip_backup/test/ablation/norf"

  onthefly:
    pdb_dir: "/home/qkrgangeun/LigMet/data/biolip_backup/pdb"
    rf_model_path: "/home/qkrgangeun/LigMet/data/rf_param/0415_newlabel_chain1"  # ← 이름 확인!
    topk: 16
    edge_dist_cutoff: 15
    pocket_dist: 3
